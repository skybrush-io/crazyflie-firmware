# Parameters to use with the Lighthouse positioning system
CONFIG_SHOW_POSITIONING_ACTIVE_MARKER=n
CONFIG_SHOW_POSITIONING_LIGHTHOUSE=y
CONFIG_SHOW_POSITIONING_UWB=n
CONFIG_SHOW_TAKEOFF_HEIGHT_CM=50

# Smaller thresholds for the home position check
CONFIG_PREFLIGHT_MAX_HOME_POSITION_DISTANCE_XY_CM=20
CONFIG_PREFLIGHT_MAX_HOME_POSITION_DISTANCE_Z_CM=20

# Allow more Lighthouse base stations
CONFIG_DECK_LIGHTHOUSE_MAX_N_BS=5
